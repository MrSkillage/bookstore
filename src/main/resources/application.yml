spring:
  application:
    name: pageturn-bookstore

  datasource:
    url: jdbc:postgresql://localhost:5432/pageturn
    username: pageturn
    password: pageturn_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  server:
    port: 8080