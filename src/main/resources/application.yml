spring:
  application:
    name: pageturn-bookstore

  datasource:
    url: jdbc:postgresql://localhost:5432/pageturn
    username: pageturn
    password: pageturn_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# JWT config — values are for dev use only
jwt:
  secret: pageturn-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-algorithm-compliance
  access-token-expiration: 900000
  refresh-token-expiration: 604800000